<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#132077" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Stock HEAS" />
  <meta name="description" content="Stock de Medicamentos e Insumos - Hospital El Alto Sur" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>Stock de Medicamentos – El Alto Sur</title>

  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-P22XLLPFPY"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-P22XLLPFPY');
  </script>

  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --blue-dark: #132077;
      --blue-mid: #018e44;
      --blue-light: #dde1f4;
      --accent: #e74c3c;
      --accent-light: #fdecea;
      --text: #1c2833;
      --text-muted: #717d7e;
      --border: #d5dbdb;
      --bg: #f2f3f4;
      --white: #ffffff;
      --radius: 12px;
      --shadow: 0 2px 8px rgba(0,0,0,0.10);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'IBM Plex Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--blue-dark);
      color: white;
      padding: 16px 16px 0;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(0,0,0,0.25);
    }

    .header-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .header-logo { width: 46px; height: 46px; border-radius: 10px; background: #fff; flex-shrink: 0; }

    .header-title { flex: 1; }

    .header-title h1 {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0.2px;
      line-height: 1.2;
    }

    .header-title p {
      font-size: 11px;
      opacity: 0.75;
      margin-top: 2px;
      font-family: 'IBM Plex Mono', monospace;
    }

    .search-wrap {
      background: rgba(255,255,255,0.12);
      border-radius: var(--radius) var(--radius) 0 0;
      padding: 12px 12px 0;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: white;
      border-radius: 8px;
      padding: 0 14px;
      gap: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .search-box svg { color: var(--blue-mid); flex-shrink: 0; }

    #searchInput {
      flex: 1;
      border: none;
      outline: none;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 15px;
      padding: 13px 0;
      color: var(--text);
      background: transparent;
    }

    #searchInput::placeholder { color: #aab; }

    #clearBtn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 18px;
      padding: 4px;
      display: none;
      line-height: 1;
    }

    .filter-tabs {
      display: flex;
      gap: 6px;
      padding: 10px 0 12px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .filter-tabs::-webkit-scrollbar { display: none; }

    .tab {
      background: rgba(255,255,255,0.18);
      color: rgba(255,255,255,0.85);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 20px;
      padding: 5px 13px;
      font-size: 12px;
      font-family: 'IBM Plex Sans', sans-serif;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .tab.active {
      background: white;
      color: var(--blue-dark);
      font-weight: 600;
      border-color: white;
    }

    .results-bar {
      padding: 10px 16px;
      font-size: 12px;
      color: var(--text-muted);
      font-family: 'IBM Plex Mono', monospace;
      border-bottom: 1px solid var(--border);
      background: white;
    }

    #listContainer {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px 80px;
    }

    .card {
      background: white;
      border-radius: var(--radius);
      margin-bottom: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      border-left: 4px solid var(--blue-mid);
      animation: fadeIn 0.2s ease;
    }

    .card.has-obs { border-left-color: var(--accent); }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card:active {
      transform: scale(0.98);
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .card-body { padding: 12px 14px; display: flex; align-items: center; gap: 12px; }
    .card-main { flex: 1; min-width: 0; }
    .stock { text-align: right; flex-shrink: 0; font-family: 'IBM Plex Mono', monospace; font-size: 17px; font-weight: 500; color: var(--blue-dark); line-height: 1.1; }
    .stock small { display: block; font-family: 'IBM Plex Sans', sans-serif; font-size: 10px; color: var(--text-muted); margin-top: 2px; }
    .stock.cero { color: var(--accent); }

    .card-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
      margin-bottom: 4px;
    }

    .card-sub {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .card-obs {
      background: var(--accent-light);
      padding: 7px 14px;
      font-size: 12px;
      color: var(--accent);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-obs.ok { background: #e6f4ec; color: #0b6b34; }
    .detail-obs.ok .detail-value { color: #0b6b34; background: #e6f4ec; }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .empty-icon { font-size: 48px; margin-bottom: 12px; }
    .empty h3 { font-size: 17px; font-weight: 600; color: var(--text); }
    .empty p { font-size: 13px; margin-top: 6px; }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 200;
      align-items: flex-end;
      justify-content: center;
    }

    .overlay.open {
      display: flex;
      animation: overlayIn 0.2s ease;
    }

    @keyframes overlayIn {
      from { background: rgba(0,0,0,0); }
      to   { background: rgba(0,0,0,0.5); }
    }

    .modal {
      background: white;
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-width: 520px;
      max-height: 85vh;
      overflow-y: auto;
      animation: slideUp 0.25s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }

    .modal-handle {
      width: 40px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 12px auto 0;
    }

    .modal-header {
      background: var(--blue-dark);
      color: white;
      padding: 20px 20px 18px;
      margin-top: 8px;
    }

    .modal-header h2 {
      font-size: 18px;
      font-weight: 600;
      line-height: 1.3;
    }

    .modal-codigo {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      opacity: 0.75;
      margin-top: 4px;
    }

    .modal-body { padding: 16px 20px 32px; }

    .detail-row {
      display: flex;
      flex-direction: column;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .detail-row:last-child { border-bottom: none; }

    .detail-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 4px;
      font-family: 'IBM Plex Mono', monospace;
    }

    .detail-value {
      font-size: 16px;
      font-weight: 500;
      color: var(--text);
      line-height: 1.4;
    }

    .detail-obs .detail-value {
      color: var(--accent);
      background: var(--accent-light);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .modal-close {
      display: block;
      width: calc(100% - 40px);
      margin: 0 20px 20px;
      padding: 14px;
      background: var(--blue-dark);
      color: white;
      border: none;
      border-radius: 10px;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
      gap: 6px;
      font-size: 12px;
      color: var(--blue-dark);
      font-weight: 600;
      z-index: 50;
    }

    .bottom-nav svg { color: var(--blue-dark); }

    mark {
      background: #fff176;
      color: inherit;
      border-radius: 2px;
      padding: 0 1px;
    }
  </style>
</head>
<body>

<header>
  <div class="header-top">
    <img class="header-logo" src="icon-192.png" alt="HEAS" />
    <div class="header-title">
      <h1>Stock de Medicamentos y Restricciones</h1>
      <p>HOSPITAL EL ALTO SUR</p>
      <p style="font-size:10px;opacity:0.6;margin-top:2px;font-family:'IBM Plex Sans',sans-serif;">Creado por: Marcelo Oviedo L.</p>
    </div>
  </div>
  <div class="search-wrap">
    <div class="search-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="searchInput" placeholder="Buscar en SUS..." autocomplete="off" autocorrect="off" spellcheck="false" />
      <button id="clearBtn" onclick="clearSearch()">✕</button>
    </div>
    <div class="filter-tabs" id="filterTabs">
      <button class="tab active" data-prog="sus">SUS</button>
      <button class="tab" data-prog="renal">Salud Renal</button>
      <button class="tab" data-prog="cancer">Lucha contra el Cáncer</button>
      <button class="tab" data-prog="tb">Tuberculosis</button>
      <button class="tab" data-prog="vih">VIH</button>
    </div>
  </div>
</header>

<div class="results-bar" id="resultsBar">Cargando...</div>

<div id="listContainer"></div>

<div class="overlay" id="overlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <h2 id="mNombre"></h2>
      <div class="modal-codigo" id="mCodigo"></div>
    </div>
    <div class="modal-body" id="mBody"></div>
    <button class="modal-close" onclick="closeModal()">Cerrar</button>
  </div>
</div>

<div class="bottom-nav">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
  BUSCAR
</div>

<script>
const PROGRAMAS = {
  sus:    'SUS',
  renal:  'Salud Renal',
  cancer: 'Lucha contra el Cáncer',
  tb:     'Tuberculosis',
  vih:    'VIH'
};

let allData = [];
let currentProg = 'sus';
let currentQuery = '';

fetch('medicamentos.json')
  .then(r => r.json())
  .then(data => {
    allData = data;
    render();
  })
  .catch(() => {
    document.getElementById('resultsBar').textContent = 'Error al cargar datos.';
  });

const input = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearBtn');

input.addEventListener('input', () => {
  currentQuery = input.value.trim();
  clearBtn.style.display = currentQuery ? 'block' : 'none';
  render();
});

document.getElementById('filterTabs').addEventListener('click', e => {
  const btn = e.target.closest('.tab');
  if (btn) setProg(btn.dataset.prog, btn);
});

function clearSearch() {
  input.value = '';
  currentQuery = '';
  clearBtn.style.display = 'none';
  input.focus();
  render();
}

function setProg(p, el) {
  currentProg = p;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  el.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
  input.placeholder = `Buscar en ${PROGRAMAS[p]}...`;
  window.scrollTo(0, 0);
  render();
}

// Búsqueda sin acentos ni mayúsculas. Cada letra se reduce a su base
// (á→a, ñ→n, ü→u) y el texto conserva exactamente la misma longitud,
// así el resaltado coincide con el texto original.
function normalize(str) {
  str = String(str == null ? '' : str);
  let out = '';
  for (let i = 0; i < str.length; i++) {
    out += str[i].normalize('NFD').charAt(0).toLowerCase().charAt(0);
  }
  return out;
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function tieneRestriccion(item) {
  const o = normalize(item.observacion).trim();
  return o !== '' && o !== 'sin restriccion';
}

function tieneStock(item) {
  return typeof item.cantidad === 'number';
}

function formatQty(n) {
  return n.toLocaleString('es-BO');
}

function highlight(text, tokens) {
  text = String(text == null ? '' : text);
  if (!tokens.length) return esc(text);
  const n = normalize(text);
  const mark = new Array(text.length).fill(false);
  tokens.forEach(t => {
    let pos = n.indexOf(t);
    while (pos !== -1) {
      for (let k = pos; k < pos + t.length; k++) mark[k] = true;
      pos = n.indexOf(t, pos + t.length);
    }
  });
  let out = '', open = false;
  for (let i = 0; i < text.length; i++) {
    if (mark[i] && !open) { out += '<mark>'; open = true; }
    if (!mark[i] && open) { out += '</mark>'; open = false; }
    out += esc(text[i]);
  }
  if (open) out += '</mark>';
  return out;
}

function render() {
  const tokens = normalize(currentQuery).split(/\s+/).filter(Boolean);
  const container = document.getElementById('listContainer');

  const filtered = allData.filter(item => {
    if (item.programa !== currentProg) return false;
    if (!tokens.length) return true;
    const texto = normalize([item.medicamento, item.codigo, item.forma,
                             item.concentracion, item.observacion].join(' '));
    return tokens.every(t => texto.includes(t));
  });

  document.getElementById('resultsBar').textContent =
    `${filtered.length} resultado${filtered.length !== 1 ? 's' : ''} en ${PROGRAMAS[currentProg]}`;

  if (filtered.length === 0) {
    container.innerHTML = `
      <div class="empty">
        <div class="empty-icon">🔍</div>
        <h3>Sin resultados</h3>
        <p>Prueba con otro nombre o cambia de pestaña</p>
      </div>`;
    return;
  }

  container.innerHTML = filtered.map((item, i) => {
    const hasObs = tieneRestriccion(item);
    const nameHL = highlight(item.medicamento, tokens);
    const subText = esc([item.forma, item.concentracion].filter(Boolean).join(' · '));
    const stockHTML = tieneStock(item)
      ? `<div class="stock ${item.cantidad === 0 ? 'cero' : ''}">${item.cantidad === 0 ? 'Sin stock' : formatQty(item.cantidad)}${item.cantidad === 0 ? '' : '<small>en stock</small>'}</div>`
      : '';
    const obsHTML = item.observacion
      ? (hasObs ? `<div class="card-obs">⚠️ ${esc(item.observacion)}</div>` : `<div class="card-obs ok">✓ ${esc(item.observacion)}</div>`)
      : '';
    return `
      <div class="card ${hasObs ? 'has-obs' : ''}" onclick="openModal(${allData.indexOf(item)})" style="animation-delay:${Math.min(i,15)*20}ms">
        <div class="card-body">
          <div class="card-main">
            <div class="card-name">${nameHL}</div>
            <div class="card-sub">${subText}</div>
          </div>
          ${stockHTML}
        </div>
        ${obsHTML}
      </div>`;
  }).join('');
}

function openModal(idx) {
  const item = allData[idx];
  document.getElementById('mNombre').textContent = item.medicamento;
  document.getElementById('mCodigo').textContent = `Código: ${item.codigo}`;

  let bodyHTML = `
    <div class="detail-row">
      <div class="detail-label">Programa</div>
      <div class="detail-value">${esc(PROGRAMAS[item.programa] || '—')}</div>
    </div>
    <div class="detail-row">
      <div class="detail-label">Forma Farmacéutica</div>
      <div class="detail-value">${esc(item.forma) || '—'}</div>
    </div>
    <div class="detail-row">
      <div class="detail-label">Concentración / Presentación</div>
      <div class="detail-value">${esc(item.concentracion) || '—'}</div>
    </div>`;

  if (tieneStock(item)) {
    bodyHTML += `
    <div class="detail-row">
      <div class="detail-label">Cantidad en stock</div>
      <div class="detail-value">${item.cantidad === 0 ? 'Sin stock' : formatQty(item.cantidad)}</div>
    </div>`;
  }

  if (item.observacion) {
    const r = tieneRestriccion(item);
    bodyHTML += `
      <div class="detail-row detail-obs ${r ? '' : 'ok'}">
        <div class="detail-label">Observación / Restricción</div>
        <div class="detail-value">${r ? '⚠️' : '✓'} ${esc(item.observacion)}</div>
      </div>`;
  }

  document.getElementById('mBody').innerHTML = bodyHTML;
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('overlay')) return;
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow = '';
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
